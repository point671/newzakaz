<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Circular border with text -->
  <circle cx="50" cy="50" r="48" stroke="#FFFDF9" stroke-width="2" fill="none"/>
  
  <!-- Curved text path definition -->
  <defs>
    <path id="topTextPath" d="M 15,50 A 35,35 0 0,1 85,50"/>
    <path id="bottomTextPath" d="M 85,50 A 35,35 0 0,1 15,50"/>
  </defs>
  
  <!-- Top curved text -->
  <text fill="#FFFDF9" font-family="Involve, sans-serif" font-size="8" font-weight="400">
    <textPath href="#topTextPath" startOffset="50%" text-anchor="middle">
      ОТДЕЛКА ДОМОВ И КВАРТИР
    </textPath>
  </text>
  
  <!-- House icon outline -->
  <g fill="none" stroke="#FFFDF9" stroke-width="1.5">
    <!-- House roof -->
    <path d="M 50,25 L 30,42 L 30,70 L 70,70 L 70,42 L 50,25"/>
    <!-- Chimney -->
    <rect x="58" y="28" width="6" height="10"/>
  </g>
  
  <!-- D²DOM text -->
  <text x="50" y="62" text-anchor="middle" fill="#FFFDF9" font-family="Involve, sans-serif" font-size="12" font-weight="400">
    D²DOM
  </text>
</svg>
